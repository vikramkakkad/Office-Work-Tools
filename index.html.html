<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Image Paste, Merge and OCR Tool</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #bbb;
    }

    h2 {
      margin-top: 0;
    }

    #pasteBox {
      border: 2px dashed #3578e5;
      border-radius: 8px;
      padding: 25px;
      text-align: center;
      color: #555;
      margin-bottom: 15px;
      background: #f8fbff;
      outline: none;
    }

    #pasteBox:focus {
      background: #eaf3ff;
    }

    input[type="file"] {
      margin: 10px 0;
    }

    button {
      padding: 10px 16px;
      margin: 5px 5px 12px 0;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    #processBtn {
      background: #16803c;
    }

    #clearBtn {
      background: #c62828;
    }

    #downloadBtn {
      background: #1769aa;
      display: none;
    }

    button:disabled {
      background: #999 !important;
      cursor: not-allowed;
    }

    #counter {
      font-weight: bold;
      color: #1769aa;
    }

    #status {
      font-weight: bold;
      color: #1769aa;
      margin: 10px 0;
    }

    #previewArea {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin: 15px 0;
    }

    .previewCard {
      border: 1px solid #ccc;
      padding: 6px;
      border-radius: 6px;
      background: #fafafa;
      text-align: center;
    }

    .previewCard img {
      width: 100%;
      height: 120px;
      object-fit: contain;
      background: #eee;
    }

    canvas {
      max-width: 100%;
      border: 1px solid #aaa;
      margin-top: 15px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      box-sizing: border-box;
      margin-top: 8px;
      font-size: 14px;
      padding: 10px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Clipboard Image Merge અને OCR Tool</h2>

    <div id="pasteBox" tabindex="0">
      અહીં ક્લિક કરો અને પછી <b>Ctrl + V</b> દબાવીને ઈમેજ paste કરો<br />
      મહત્તમ 10 ઈમેજ
    </div>

    <input
      type="file"
      id="fileInput"
      accept="image/png,image/jpeg,image/jpg"
      multiple
    />

    <div id="counter">0 / 10 ઈમેજ ઉમેરાઈ છે</div>

    <div id="previewArea"></div>

    <button id="processBtn" disabled>Process કરો</button>
    <button id="clearBtn">બધી ઈમેજ Clear કરો</button>
    <button id="downloadBtn">Merged Image Download કરો</button>

    <div id="status"></div>

    <h3>Merged Image</h3>
    <canvas id="mergedCanvas"></canvas>

    <h3>OCR Result</h3>
    <textarea id="ocrText" placeholder="અહીં OCR text દેખાશે..."></textarea>
  </div>

  <script>
    const MAX_IMAGES = 10;

    let images = [];

    const pasteBox = document.getElementById("pasteBox");
    const fileInput = document.getElementById("fileInput");
    const previewArea = document.getElementById("previewArea");
    const counter = document.getElementById("counter");
    const processBtn = document.getElementById("processBtn");
    const clearBtn = document.getElementById("clearBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const statusBox = document.getElementById("status");
    const canvas = document.getElementById("mergedCanvas");
    const ocrText = document.getElementById("ocrText");

    // Clipboardમાંથી image paste
    document.addEventListener("paste", function(event) {
      const clipboardItems = event.clipboardData.items;

      for (const item of clipboardItems) {
        if (item.type.startsWith("image/")) {
          const file = item.getAsFile();
          addImage(file);
          event.preventDefault();
          break;
        }
      }
    });

    // File upload
    fileInput.addEventListener("change", function() {
      const selectedFiles = Array.from(fileInput.files);

      for (const file of selectedFiles) {
        if (images.length >= MAX_IMAGES) break;
        addImage(file);
      }

      fileInput.value = "";
    });

    function addImage(file) {
      if (!file || !file.type.startsWith("image/")) {
        return;
      }

      if (images.length >= MAX_IMAGES) {
        alert("વધુમાં વધુ 10 ઈમેજ જ ઉમેરી શકાય છે.");
        return;
      }

      const reader = new FileReader();

      reader.onload = function(e) {
        const img = new Image();

        img.onload = function() {
          images.push({
            file: file,
            image: img,
            src: e.target.result
          });

          renderPreviews();
        };

        img.src = e.target.result;
      };

      reader.readAsDataURL(file);
    }

    function renderPreviews() {
      previewArea.innerHTML = "";

      images.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "previewCard";

        card.innerHTML = `
          <img src="${item.src}" alt="Image ${index + 1}">
          <div>Image ${index + 1}</div>
        `;

        previewArea.appendChild(card);
      });

      counter.innerText = `${images.length} / ${MAX_IMAGES} ઈમેજ ઉમેરાઈ છે`;
      processBtn.disabled = images.length === 0;
    }

    // Imagesને vertical રીતે merge કરવી
    function mergeImages() {
      if (images.length === 0) {
        alert("પહેલા ઓછામાં ઓછી એક ઈમેજ ઉમેરો.");
        return;
      }

      const margin = 20;
      const backgroundColor = "white";

      let maxWidth = 0;
      let totalHeight = margin;

      images.forEach(item => {
        maxWidth = Math.max(maxWidth, item.image.width);
        totalHeight += item.image.height + margin;
      });

      canvas.width = maxWidth + margin * 2;
      canvas.height = totalHeight;

      const ctx = canvas.getContext("2d");

      ctx.fillStyle = backgroundColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let y = margin;

      images.forEach(item => {
        const x = (canvas.width - item.image.width) / 2;
        ctx.drawImage(item.image, x, y);
        y += item.image.height + margin;
      });

      downloadBtn.style.display = "inline-block";
    }

    // Process button
    processBtn.addEventListener("click", async function() {
      processBtn.disabled = true;
      statusBox.innerText = "ઈમેજ merge થઈ રહી છે...";

      mergeImages();

      statusBox.innerText = "OCR શરૂ થઈ રહ્યું છે...";

      try {
        const result = await Tesseract.recognize(
          canvas,
          "eng",
          {
            logger: function(info) {
              if (info.status === "recognizing text") {
                statusBox.innerText =
                  "OCR ચાલી રહ્યું છે: " +
                  Math.round(info.progress * 100) +
                  "%";
              }
            }
          }
        );

        ocrText.value = result.data.text;
        statusBox.innerText = "Process પૂર્ણ થયું.";
      } catch (error) {
        console.error(error);
        statusBox.innerText = "OCR કરતી વખતે ભૂલ આવી.";
      }

      processBtn.disabled = false;
    });

    // Merged image download
    downloadBtn.addEventListener("click", function() {
      const link = document.createElement("a");
      link.download = "merged-image.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    // Clear button
    clearBtn.addEventListener("click", function() {
      images = [];
      previewArea.innerHTML = "";
      ocrText.value = "";
      statusBox.innerText = "";
      canvas.width = 300;
      canvas.height = 150;
      downloadBtn.style.display = "none";
      renderPreviews();
    });
  </script>
</body>
</html>
